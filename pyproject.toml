[project]
name = "alu-simulator"
version = "0.1.0"
description = "mini ALU simulator project for CS 325"
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "pytest>=9.2.0",
    "readchar>=4.2.2",
    "rich>=15.0.0",
]

[project.scripts]
alu = "alu_simulator.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.taskipy.tasks]
build = "pyinstaller --onefile --paths=src --copy-metadata readchar build.py --name alu_simulator"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "taskipy>=1.14.1",
]
