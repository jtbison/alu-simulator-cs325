name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install Python
        run: uv python install 3.14

      - name: Build executable
        run: uv run --python 3.14 --with pyinstaller pyinstaller --onefile --console --name alu-simulator-cs325 launcher.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: alu-simulator-cs325-${{ matrix.os }}
          path: dist/alu-simulator-cs325*
          if-no-files-found: error